<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Dual-Slot Buttons with SVG (Demo Reducida)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="buttons-grid">

    <!-- VOTE -->
    <button class="btn-dual vote">
      <span class="btn-text">VOTE</span>
      <span class="btn-icon">
        <svg viewBox="0 0 24 24">
          <polyline class="check-mark" points="4,12 9,17 20,6" />
        </svg>
      </span>
    </button>

    <!-- DOWNLOAD -->
    <button class="btn-dual download">
      <span class="btn-text">DOWNLOAD</span>
      <span class="btn-icon">
        <svg viewBox="0 0 24 24">
          <!-- Arrow pointing down -->
          <path class="download-arrow" fill="#ffffff" d="M19 9h-4V3H9v6H5l7 7 7-7z" />
          <!-- Base horizontal line being drawn -->
          <line class="download-line" x1="4" y1="20" x2="20" y2="20" />
        </svg>
      </span>
    </button>

    <!-- SEND -->
    <button class="btn-dual send">
      <span class="btn-text">SEND</span>
      <span class="btn-icon">
        <div class="send-container">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </div>
      </span>
    </button>

  </div>

</body>
</html>
